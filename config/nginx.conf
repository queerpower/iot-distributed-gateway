# ============================================================
# Nginx 四层负载均衡配置
# 用于分布式IoT设备监控与指令调度平台
#
# 工作原理:
#   - 设备通过 MQTT(TCP) 连接到 Nginx 的 1883 端口
#   - Nginx 在四层 (TCP) 将连接分发到后端网关节点
#   - 支持 least_conn (最少连接) 或 round_robin 策略
#   - 后端节点故障时自动摘除, 恢复后自动加入
#
# 部署:
#   cp nginx.conf /etc/nginx/nginx.conf (或 include 到现有配置)
#   nginx -t && nginx -s reload
#
# 验证:
#   # 查看后端节点状态
#   curl http://127.0.0.1:8081/api/v1/cluster   # Gateway-1
#   curl http://127.0.0.1:8082/api/v1/cluster   # Gateway-2
#   curl http://127.0.0.1:8083/api/v1/cluster   # Gateway-3
#
#   # 连接设备模拟器 (连接到 Nginx 入口)
#   ./device_simulator --host 127.0.0.1 --port 1883 --devices 10000
#
#   # 设备会被均匀分发到三个网关节点
# ============================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 65535;            # 每个 worker 最大连接数
    use epoll;
    multi_accept on;                     # 一次 accept 所有新连接
}

# ============================================================
# Stream 模块 — TCP/UDP 四层代理
# ============================================================
stream {
    # 日志格式
    log_format proxy '$remote_addr [$time_local] '
                     '$protocol $status $bytes_sent $bytes_received '
                     '$session_time "$upstream_addr"';

    access_log /var/log/nginx/stream-access.log proxy;
    error_log  /var/log/nginx/stream-error.log;

    # ---- 上游网关节点池 ----
    upstream iot_gateway_backend {
        # 负载均衡策略: least_conn (最少连接数, 适合长连接场景)
        least_conn;

        # 网关节点列表
        # 生产环境: 替换为实际 IP
        # 开发环境: 多实例在本机不同端口
        server 127.0.0.1:1883 weight=1 max_fails=3 fail_timeout=30s;
        server 127.0.0.1:1884 weight=1 max_fails=3 fail_timeout=30s;
        server 127.0.0.1:1885 weight=1 max_fails=3 fail_timeout=30s;

        # 扩展: 添加更多节点实现水平扩展
        # server 192.168.1.11:1883 weight=1 max_fails=3 fail_timeout=30s;
        # server 192.168.1.12:1883 weight=1 max_fails=3 fail_timeout=30s;

        # 健康检查参数:
        #   max_fails=3    — 连续失败 3 次后标记为不可用
        #   fail_timeout=30s — 不可用持续 30 秒后尝试恢复
        #   weight=1       — 权重 (用于不均匀负载分配)
    }

    # ---- MQTT 设备接入入口 ----
    server {
        # 设备连接此端口, Nginx 透明转发到后端网关
        listen 1883;

        # 代理缓冲区 (TCP 不需要修改内容, 直接透传)
        proxy_buffer_size 16k;

        # 连接超时
        proxy_connect_timeout 5s;
        proxy_timeout 600s;  # MQTT 长连接, 超时设为 10 分钟

        # 转发到网关节点池
        proxy_pass iot_gateway_backend;

        # 透传客户端真实 IP (可选: proxy_protocol)
        # proxy_protocol on;
    }

    # ---- 管理平台 Dashboard 入口 (可选) ----
    upstream dashboard_backend {
        least_conn;
        server 127.0.0.1:9090;
        server 127.0.0.1:9091;
    }

    server {
        listen 9090;
        proxy_pass dashboard_backend;
        proxy_connect_timeout 3s;
        proxy_timeout 30s;
    }
}

# ============================================================
# HTTP 模块 — API 反向代理 (可选)
# ============================================================
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # ---- API 网关节点池 ----
    upstream api_backend {
        # ip_hash 可用于保持会话粘性
        # ip_hash;

        server 127.0.0.1:8081;
        server 127.0.0.1:8082;
        server 127.0.0.1:8083;
    }

    server {
        listen 8080;

        location /api/ {
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
        }

        location /dashboard {
            proxy_pass http://127.0.0.1:9090;
            proxy_set_header Host $host;
        }
    }
}
